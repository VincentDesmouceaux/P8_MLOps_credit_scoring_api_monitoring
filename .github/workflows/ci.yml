name: CI/CD - Tests, Build Docker, Deploy Render et Smoke Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  # -----------------------------------------------------------------
  # Tests
  # -----------------------------------------------------------------

  tests:
    name: Tests Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer uv
        uses: astral-sh/setup-uv@v6

      - name: Installer les dependances
        run: uv sync --frozen

      - name: Executer les tests
        run: uv run pytest -v


  # -----------------------------------------------------------------
  # Build Docker
  # -----------------------------------------------------------------

  build-docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l image Docker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: p8-credit-scoring-api:latest


  # -----------------------------------------------------------------
  # Deploiement Render
  # -----------------------------------------------------------------

  deploy:
    name: Deploy Render
    runs-on: ubuntu-latest
    needs: build-docker

    if: >
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'

    steps:
      - name: Declencher le deploiement Render
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            --request POST \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"


  # -----------------------------------------------------------------
  # Smoke tests production
  # -----------------------------------------------------------------

  smoke-test:
    name: Smoke Test Production
    runs-on: ubuntu-latest
    needs: deploy

    if: >
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'

    steps:
      - name: Verifier la configuration du smoke test
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Le secret API_URL est absent."
            exit 1
          fi

          echo "Configuration du smoke test disponible."


      - name: Attendre que l API Render soit disponible
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          for attempt in {1..30}; do
            echo "Tentative $attempt/30"

            if curl \
              --fail \
              --silent \
              --show-error \
              "$API_URL/health"
            then
              echo ""
              echo "API disponible."
              exit 0
            fi

            echo \
              "API pas encore disponible. " \
              "Nouvelle tentative dans 10 secondes..."

            sleep 10
          done

          echo \
            "L API Render n est pas devenue disponible " \
            "dans le delai imparti."

          exit 1


      - name: Verifier model-info
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          curl \
            --fail \
            --show-error \
            --silent \
            "$API_URL/model-info"

          echo ""
          echo "Endpoint model-info disponible."